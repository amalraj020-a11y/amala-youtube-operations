name: Amala Code Quest review build

on:
  workflow_dispatch:

concurrency:
  group: amala-code-quest-review
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-private-review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install free media tools
        run: sudo apt-get update && sudo apt-get install -y espeak-ng ffmpeg fonts-dejavu-core
      - name: Install Pillow
        run: pip install "Pillow>=10,<13"
      - name: Render private review video
        run: python scripts/code_quest.py
      - name: Save review package
        uses: actions/upload-artifact@v4
        with:
          name: amala-code-quest-review-${{ github.run_id }}
          path: code-quest-output/
          retention-days: 7
